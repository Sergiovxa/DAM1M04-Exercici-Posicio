        <div class="contenidor">

            <h1>Contacte</h1>

            <div class="contacte">

                <form>
                    <label>Nom</label>
                    <input type="text" name="nom" required>

                    <label>Email</label>

                    <label>Missatge</label>
                    <textarea rows="5" name="missatge" required></textarea>

                    <button type="submit">Enviar</button>
                </form>

                <div class="info">
                    <h3>Informació</h3>
                    <p>Adreça: Carrer Major 12, Barcelona</p>
                    <p>Horari: Dilluns a dissabtes, 9h - 20h</p>
                    <p>Telèfon: 967 263 892</p>
                    <div class="mapa-fictici">
                        <span class="marcador-mapa">📍</span>
                        <p class="text-marca">FitShark</p>
                        <span class="text-mapa">Barcelona</span>
                    </div>
                </div>

            </div>

        </div>
